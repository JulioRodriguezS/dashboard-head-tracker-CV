<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heatmap SaaS - Visor de Análisis</title>
    <!-- Importar Chart.js para las gráficas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: #0f172a; 
            color: #e5e7eb; 
            margin: 0; 
            padding: 24px; 
        }
        .header-controls { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            gap: 15px; 
        }
        .controls-right { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            width: 60%; 
        }
        input[type="url"] { 
            flex: 1; 
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid #333; 
            background: #1e293b; 
            color: #fff; 
        }
        button { 
            background: #38bdf8; 
            color: #0f172a; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        button:hover { opacity: 0.8; }
        
        /* Estilos del nuevo panel de analíticas */
        .analytics-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        .panel-card {
            background: #1e293b;
            border: 1px solid rgba(148, 163, 184, 0.4);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            height: 300px; /* Altura fija para mantener alineación */
            overflow-y: auto;
        }
        .panel-card h3 {
            margin-top: 0;
            font-size: 1rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        
        /* Estilos de la tabla de visitas */
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #334155; }
        th { color: #38bdf8; font-weight: 600; }
        tr:hover { background: rgba(255,255,255,0.05); }

        /* Estilos del canvas del Heatmap */
        .canvas-container {
            width: 100%;
            height: 850px;
            overflow-y: auto; 
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.4);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .scroll-wrapper {
            position: relative;
            width: 100%;
            height: 3500px; 
        }
        iframe { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            z-index: 1; border: none; background: #fff; 
        }
        .heatmap-layer { 
            position: absolute; 
            top: 0; left: 0; 
            z-index: 2; pointer-events: none; 
        }

        /* Nuevos estilos para la pantalla de Login */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .login-box {
            background: #1e293b; padding: 40px; border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center; width: 400px;
        }
        .login-box input {
            width: 100%; padding: 12px; margin: 20px 0;
            border-radius: 8px; border: 1px solid #333; background: #0f172a; color: #fff;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <!-- PANTALLA DE BLOQUEO (LOGIN) -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2 style="margin-top:0; color: #38bdf8;">Autenticación Requerida</h2>
            <p style="color: #9ca3af; font-size: 0.9rem;">Ingresa tu Service Role Key para acceder a las analíticas.</p>
            <input type="password" id="secretKeyInput" placeholder="eyJhbGciOiJIUzI1...">
            <button onclick="login()">Desbloquear Dashboard</button>
        </div>
    </div>
    
    <div class="header-controls">
        <h2>Panel de Mapas de Calor y Analíticas</h2>
        <div class="controls-right">
            <input type="url" id="targetUrl" placeholder="URL cargada dinámicamente..." readonly>
            <button onclick="renderDashboard()">Actualizar Datos</button>
        </div>
    </div>
    
    <!-- Nuevo Panel de KPIs -->
    <div class="analytics-panel">
        <div class="panel-card">
            <h3>Tráfico de Visitas (Últimos 7 días)</h3>
            <div style="position: relative; height: 230px; width: 100%;">
                <canvas id="visitsChart"></canvas>
            </div>
        </div>
        <div class="panel-card">
            <h3>Registro Geográfico y Dispositivos</h3>
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Ubicación</th>
                        <th>Sistema</th>
                    </tr>
                </thead>
                <tbody id="kpiTableBody">
                    <!-- Los datos se inyectarán aquí -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Contenedor del Heatmap -->
    <div class="canvas-container" id="canvasContainer">
        <div class="scroll-wrapper" id="scrollWrapper">
            <iframe id="backgroundIframe" scrolling="no" src="about:blank"></iframe>
            <canvas id="heatmapCanvas" class="heatmap-layer"></canvas>
        </div>
    </div>
    <script>
        const SUPABASE_URL = 'https://tbhyzovkwpetnpyumblb.supabase.co';
        let SUPABASE_KEY = ''; // ¡LA LLAVE ESTÁ VACÍA EN EL CÓDIGO FUENTE!
        let chartInstance = null;

        // Lógica de Autenticación
        function checkAuth() {
            const storedKey = sessionStorage.getItem('supabase_admin_key');
            if (storedKey) {
                SUPABASE_KEY = storedKey;
                document.getElementById('loginOverlay').style.display = 'none';
                renderDashboard(); // Arranca el sistema si hay llave
            }
        }

        function login() {
            const inputKey = document.getElementById('secretKeyInput').value.trim();
            if (inputKey) {
                sessionStorage.setItem('supabase_admin_key', inputKey);
                SUPABASE_KEY = inputKey;
                document.getElementById('loginOverlay').style.display = 'none';
                renderDashboard();
            } else {
                alert("Por favor, ingresa una llave válida.");
            }
        }

        async function renderDashboard() {
            // Si por alguna razón llegan aquí sin llave, abortar
            if(!SUPABASE_KEY) return; 
            
            await Promise.all([
                renderKpis(),
                renderHeatmap()
            ]);
        }

        // ... (MANTÉN TUS FUNCIONES renderKpis, renderHeatmap y drawThermalPoint EXACTAMENTE IGUAL) ...

        // Cambiamos el evento load para que primero revise la seguridad
        window.addEventListener('load', checkAuth);
    </script>
    <script>
        let chartInstance = null; // Para destruir la gráfica anterior al recargar

        // Función principal que orquesta todo el renderizado
        async function renderDashboard() {
            await Promise.all([
                renderKpis(),
                renderHeatmap()
            ]);
        }

        async function renderKpis() {
            try {
                // Leer datos de la tabla kpis ordenados por fecha más reciente
                const response = await fetch(`${SUPABASE_URL}/rest/v1/kpis?select=created_at,city,region,country_name,platform,vendor&order=created_at.desc`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                const data = await response.json();

                // 1. Llenar la Tabla (Top 20 visitas)
                const tbody = document.getElementById('kpiTableBody');
                tbody.innerHTML = data.slice(0, 20).map(row => {
                    const date = new Date(row.created_at).toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' });
                    // Filtrar nulos si hay bloqueadores de anuncios
                    const location = row.city ? `${row.city}, ${row.country_name}` : 'Ubicación oculta';
                    const device = row.platform ? row.platform : 'Desconocido';
                    
                    return `
                        <tr>
                            <td>${date}</td>
                            <td>${location}</td>
                            <td>${device}</td>
                        </tr>
                    `;
                }).join('');

                // 2. Procesar datos para la Gráfica de Línea (Agrupación por día)
                const visitsByDate = {};
                data.forEach(row => {
                    const dateObj = new Date(row.created_at);
                    // Formato YYYY-MM-DD
                    const dateStr = dateObj.toISOString().split('T')[0];
                    visitsByDate[dateStr] = (visitsByDate[dateStr] || 0) + 1;
                });
                
                // Ordenar las fechas de menor a mayor
                const labels = Object.keys(visitsByDate).sort();
                const chartData = labels.map(date => visitsByDate[date]);

                // 3. Renderizar la Gráfica
                const ctxChart = document.getElementById('visitsChart').getContext('2d');
                
                if (chartInstance) {
                    chartInstance.destroy(); // Limpiar gráfica si ya existía
                }

                chartInstance = new Chart(ctxChart, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Visitas Diarias',
                            data: chartData,
                            borderColor: '#38bdf8',
                            backgroundColor: 'rgba(56, 189, 248, 0.2)',
                            borderWidth: 2,
                            pointBackgroundColor: '#fff',
                            tension: 0.4, // Curva suave
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { 
                                beginAtZero: true, 
                                ticks: { color: '#9ca3af', stepSize: 1, precision: 0 },
                                grid: { color: 'rgba(51, 65, 85, 0.5)' }
                            },
                            x: { 
                                ticks: { color: '#9ca3af' },
                                grid: { display: false }
                            }
                        },
                        plugins: {
                            legend: { display: false } // Ocultar leyenda para más limpieza
                        }
                    }
                });

            } catch (error) {
                console.error('Error cargando KPIs:', error);
            }
        }

        async function renderHeatmap() {
            const canvas = document.getElementById('heatmapCanvas');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('canvasContainer');
            const iframe = document.getElementById('backgroundIframe');
            const urlInput = document.getElementById('targetUrl');

            const wrapper = document.getElementById('scrollWrapper');
            canvas.width = wrapper.clientWidth;
            canvas.height = wrapper.clientHeight;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/heatmap_data?select=url,screen_width,coordinates`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                
                const data = await response.json();
                
                if(data.length > 0 && data[0].url) {
                    const targetUrl = data[0].url;
                    urlInput.value = targetUrl;
                    if(iframe.src !== targetUrl) iframe.src = targetUrl;
                }

                data.forEach(session => {
                    if (session.coordinates && session.screen_width) {
                        const offsetX = (canvas.width - session.screen_width) / 2;
                        session.coordinates.forEach(point => {
                            const adjustedX = point.x + offsetX;
                            drawThermalPoint(ctx, adjustedX, point.y, point.type);
                        });
                    }
                });
                
            } catch (error) {
                console.error('Error de conexión con Supabase (Heatmap):', error);
            }
        }

        function drawThermalPoint(ctx, x, y, type) {
            const radius = type === 'click' ? 18 : 35;
            const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);

            if (type === 'click') {
                gradient.addColorStop(0, 'rgba(239, 68, 68, 0.9)');
                gradient.addColorStop(1, 'rgba(239, 68, 68, 0)');
            } else {
                gradient.addColorStop(0, 'rgba(56, 189, 248, 0.08)');
                gradient.addColorStop(1, 'rgba(56, 189, 248, 0)');
            }

            ctx.beginPath();
            ctx.arc(x, y, radius, 0, 2 * Math.PI);
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        // Cargar los datos automáticamente al abrir el dashboard
        window.addEventListener('load', renderDashboard);
    </script>    
</body>
</html>
