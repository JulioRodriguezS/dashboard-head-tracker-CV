<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heatmap SaaS - Visor de Análisis</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background: #0f172a; 
            color: #e5e7eb; 
            margin: 0; 
            padding: 24px; 
        }
        .header-controls { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            gap: 15px; 
        }
        .controls-right { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
            width: 60%; 
        }
        input[type="url"] { 
            flex: 1; 
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid #333; 
            background: #1e293b; 
            color: #fff; 
        }
        button { 
            background: #38bdf8; 
            color: #0f172a; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        button:hover { opacity: 0.8; }
        
        .canvas-container {
            position: relative;
            border: 1px solid rgba(148, 163, 184, 0.4);
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
            height: 850px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        iframe { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 1; 
            border: none; 
            background: #fff; 
        }
        canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            z-index: 2; 
            pointer-events: none; /* Permite hacer scroll sobre el iframe inferior */
        }
    </style>
</head>
<body>
    <div class="header-controls">
        <h2>Panel de Mapas de Calor</h2>
        <div class="controls-right">
            <input type="url" id="targetUrl" placeholder="URL cargada dinámicamente..." readonly>
            <button onclick="renderHeatmap()">Cargar y Renderizar</button>
        </div>
    </div>
    
    <div class="canvas-container" id="canvasContainer">
        <!-- El sitio web real se carga aquí -->
        <iframe id="backgroundIframe" src="about:blank"></iframe>
        <!-- Las manchas térmicas se pintan aquí -->
        <canvas id="heatmapCanvas"></canvas>
    </div>

    <script>
        const SUPABASE_URL = 'https://tbhyzovkwpetnpyumblb.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRiaHl6b3Zrd3BldG5weXVtYmxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMDUxOTksImV4cCI6MjEwMzU4MTE5OX0._P132KIv3H6q7bYFXxrnfcyEoSUNabfnqjovO9SinLU'; 

        async function renderHeatmap() {
            const canvas = document.getElementById('heatmapCanvas');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('canvasContainer');
            const iframe = document.getElementById('backgroundIframe');
            const urlInput = document.getElementById('targetUrl');

            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            try {
                // Solicitar URL y coordenadas simultáneamente
                const response = await fetch(`${SUPABASE_URL}/rest/v1/heatmap_data?select=url,coordinates`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                
                const data = await response.json();
                
                // Extraer la primera URL disponible e inyectarla en el iframe
                if(data.length > 0 && data[0].url) {
                    const targetUrl = data[0].url;
                    urlInput.value = targetUrl;
                    
                    // Evitar recargar el iframe entero si la URL es la misma
                    if(iframe.src !== targetUrl) {
                        iframe.src = targetUrl;
                    }
                }

                data.forEach(session => {
                    if (session.coordinates) {
                        session.coordinates.forEach(point => {
                            drawThermalPoint(ctx, point.x, point.y, point.type);
                        });
                    }
                });
                
            } catch (error) {
                console.error('Error de conexión con Supabase:', error);
            }
        }

        function drawThermalPoint(ctx, x, y, type) {
            const radius = type === 'click' ? 18 : 35;
            const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);

            if (type === 'click') {
                gradient.addColorStop(0, 'rgba(239, 68, 68, 0.9)');
                gradient.addColorStop(1, 'rgba(239, 68, 68, 0)');
            } else {
                gradient.addColorStop(0, 'rgba(56, 189, 248, 0.08)');
                gradient.addColorStop(1, 'rgba(56, 189, 248, 0)');
            }

            ctx.beginPath();
            ctx.arc(x, y, radius, 0, 2 * Math.PI);
            ctx.fillStyle = gradient;
            ctx.fill();
        }
    </script>
</body>
</html>
